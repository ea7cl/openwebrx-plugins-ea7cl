# OpenWebRX+ por https en el puerto 8443 (EA7CL). El 8073 sigue igual, por http.
# nginx recibe https y se lo pasa a OpenWebRX por dentro (127.0.0.1:8073).
# OpenWebRX se fía de X-Forwarded-For cuando la conexión le llega del propio equipo, así
# que el límite de conexiones por IP, los vetos y el registro siguen viendo la IP real.

map $http_upgrade $owrx_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:owrx:5m;
    ssl_session_timeout 1d;

    # si alguien entra con http:// en el puerto 8443, se le manda a https://
    error_page 497 =301 https://$host:8443$request_uri;

    access_log off;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8073;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $owrx_connection_upgrade;
        proxy_set_header Host $host;
        # solo la IP real del oyente: lo que mande el navegador en esta cabecera se descarta
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # audio y cascada en directo: sin búfer y sin cortar conexiones largas
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
